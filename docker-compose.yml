services:
  postgres:
    image: postgres:18-alpine
    container_name: dems-postgres
    environment:
      POSTGRES_DB: "${DB_NAME:-dataentry}"
      POSTGRES_USER: "${DB_USERNAME:-daleel}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set in .env}"
    volumes:
      - dems-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-daleel} -d ${DB_NAME:-dataentry}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    mem_limit: 3g
    shm_size: 1gb
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=768MB"
      - "-c"
      - "effective_cache_size=2GB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "max_wal_size=2GB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "max_worker_processes=8"
      - "-c"
      - "max_parallel_workers=8"
      - "-c"
      - "max_parallel_workers_per_gather=4"

  backend:
    build:
      context: ./backend
    container_name: dems-backend
    environment:
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set (min 32 chars) — see .env}"
      SPRING_PROFILES_ACTIVE: "docker"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://${DB_DOCKER_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME:-dataentry}"
      SPRING_DATASOURCE_USERNAME: "${DB_USERNAME:-daleel}"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set in .env}"
      APP_CORS_ALLOWED_ORIGINS: "${APP_CORS_ALLOWED_ORIGINS:-https://dataentry.neurix.uk}"
      APP_SEED_ADMIN_USERNAME: "${APP_SEED_ADMIN_USERNAME:-admin}"
      APP_SEED_ADMIN_PASSWORD: "${APP_SEED_ADMIN_PASSWORD:-}"
      APP_SEED_SUPERADMIN_USERNAME: "${APP_SEED_SUPERADMIN_USERNAME:-superadmin}"
      APP_SEED_SUPERADMIN_PASSWORD: "${APP_SEED_SUPERADMIN_PASSWORD:-}"
      APP_TRUSTED_PROXIES: "${APP_TRUSTED_PROXIES:-}"
      APP_SEED_ENABLED: "${APP_SEED_ENABLED:-false}"
      APP_AUTH_COOKIE_SECURE: "${APP_AUTH_COOKIE_SECURE:-true}"
      APP_LOGIN_RATE_STORAGE: "${APP_LOGIN_RATE_STORAGE:-database}"
      APP_UPLOADS_PER_USER_DAILY_BYTES: "${APP_UPLOADS_PER_USER_DAILY_BYTES:-5368709120}"
      TRANSLATION_BASE_URL: "${TRANSLATION_BASE_URL:-http://libretranslate:5000}"
      TRANSLATION_API_KEY: "${TRANSLATION_API_KEY:-}"
      APP_OCR_TESSDATA_PATH: "${APP_OCR_TESSDATA_PATH:-}"
      APP_OCR_LANGUAGES: "${APP_OCR_LANGUAGES:-ara+eng}"
    volumes:
      - dems-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8080"
      - "9090"
    ports:
      - "127.0.0.1:8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
      libretranslate:
        condition: service_started
    restart: unless-stopped
    mem_limit: 7g
    labels:
      - "neurix.proxy.domain=dataentry-api.neurix.uk"
      - "neurix.proxy.port=8083"

  frontend:
    build:
      context: ./frontend
    container_name: dems-frontend
    depends_on:
      - backend
    ports:
      - "8082:80"
    restart: unless-stopped
    mem_limit: 512m
    labels:
      - "neurix.proxy.domain=dataentry.neurix.uk"
      - "neurix.proxy.port=8082"

  backup:
    image: postgres:18-alpine
    container_name: dems-backup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BACKUP_DB_HOST: "postgres"
      BACKUP_DB_PORT: "5432"
      BACKUP_DB_NAME: "${DB_NAME:-dataentry}"
      BACKUP_DB_USER: "${DB_USERNAME:-daleel}"
      BACKUP_DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set in .env}"
      BACKUP_INTERVAL_SECONDS: "${BACKUP_INTERVAL_SECONDS:-86400}"
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-14}"
    volumes:
      - dems-backups:/backups
      - ./scripts/backup/backup-loop.sh:/usr/local/bin/backup-loop.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup-loop.sh"]
    restart: unless-stopped
    mem_limit: 256m

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: dems-prometheus
    depends_on:
      - backend
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - dems-prometheus-data:/prometheus
    restart: unless-stopped
    mem_limit: 512m

  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: dems-alertmanager
    depends_on:
      - prometheus
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--data.retention=120h"
      # Publish the UI port to the internal docker network only. Operators can browse
      # to http://<host>:9093 after temporarily adding `ports: ["9093:9093"]` here or
      # through a Neurix proxy label.
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - dems-alertmanager-data:/alertmanager
    restart: unless-stopped
    mem_limit: 256m

  grafana:
    image: grafana/grafana:11.3.0
    container_name: dems-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-http://localhost:3000}"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - dems-grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    restart: unless-stopped
    mem_limit: 512m
    labels:
      - "neurix.proxy.domain=grafana.neurix.uk"
      - "neurix.proxy.port=3001"

  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: dems-libretranslate
    environment:
      LT_LOAD_ONLY: "en,ar"
      LT_DISABLE_WEB_UI: "true"
      LT_UPDATE_MODELS: "false"
    volumes:
      - libretranslate-models:/home/libretranslate/.local
    expose:
      - "5000"
    restart: unless-stopped
    mem_limit: 1500m
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/languages', timeout=5).read()"]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 120s

volumes:
  dems-data:
    driver: local
  dems-postgres-data:
    driver: local
  dems-backups:
    driver: local
  dems-prometheus-data:
    driver: local
  dems-alertmanager-data:
    driver: local
  dems-grafana-data:
    driver: local
  libretranslate-models:
    driver: local
