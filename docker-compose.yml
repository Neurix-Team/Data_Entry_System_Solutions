services:
  backend:
    build:
      context: ./backend
    container_name: dems-backend
    environment:
      # Change these before running in production
      JWT_SECRET: "change-me-in-production-a-very-long-random-secret-key-min-32-chars"
      SPRING_PROFILES_ACTIVE: "docker"
    volumes:
      # Persist the SQLite database on the host
      - dems-data:/app/data
    expose:
      - "8080"
    ports:
      - "8083:8080"
    restart: unless-stopped
    labels:
      # Neurix reverse proxy → auto-SSL. Domain gets an https cert; port is the host port above.
      - "neurix.proxy.domain=dataentry-api.neurix.uk"
      - "neurix.proxy.port=8083"

  frontend:
    build:
      context: ./frontend
    container_name: dems-frontend
    depends_on:
      - backend
    ports:
      - "8082:80"
    restart: unless-stopped
    labels:
      # Public UI — this is what end-users open in their browser.
      - "neurix.proxy.domain=dataentry.neurix.uk"
      - "neurix.proxy.port=8082"

volumes:
  dems-data:
    driver: local
