services:
  backend:
    build:
      context: ./backend
    container_name: dems-backend
    environment:
      # JWT_SECRET is required from the host env (no baked-in default).  Set it in a .env
      # file next to this compose file:  JWT_SECRET=<random-32+-chars>
      # If unset the container fails fast at startup — see AppConfig#jwtSecret.
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set (min 32 chars) — see .env}"
      SPRING_PROFILES_ACTIVE: "docker"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://${DB_DOCKER_HOST:-host.docker.internal}:${DB_PORT:-5432}/${DB_NAME:-dataentry}"
      SPRING_DATASOURCE_USERNAME: "${DB_USERNAME:-daleel}"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set in .env}"
      # Which browser origins may call the API (comma-separated).  The API sends credentialed
      # cookies, so "*" is rejected at boot by SecurityConfig — an explicit allowlist is required.
      # Override in .env when the UI is served from a different host, e.g.:
      #   APP_CORS_ALLOWED_ORIGINS=https://dataentry.neurix.uk,https://admin.neurix.uk
      APP_CORS_ALLOWED_ORIGINS: "${APP_CORS_ALLOWED_ORIGINS:-https://dataentry.neurix.uk}"
      # Rotate these before first prod boot.  admin/admin123 is dev-only.
      APP_SEED_ADMIN_USERNAME: "${APP_SEED_ADMIN_USERNAME:-admin}"
      APP_SEED_ADMIN_PASSWORD: "${APP_SEED_ADMIN_PASSWORD:-admin123}"
      # SUPER_ADMIN owns every team and can impersonate any team's admin.  Rotate before
      # exposing this instance — superadmin/superadmin123 is dev-only.
      APP_SEED_SUPERADMIN_USERNAME: "${APP_SEED_SUPERADMIN_USERNAME:-superadmin}"
      APP_SEED_SUPERADMIN_PASSWORD: "${APP_SEED_SUPERADMIN_PASSWORD:-superadmin123}"
      # Set to false only for local http:// dev.  Real deployments (https) leave true.
      APP_AUTH_COOKIE_SECURE: "${APP_AUTH_COOKIE_SECURE:-true}"
      # Persist brute-force counters so restarts and multiple backend replicas share state.
      APP_LOGIN_RATE_STORAGE: "${APP_LOGIN_RATE_STORAGE:-database}"
      # Rolling 24h upload cap per user (bytes). 500 MB default.
      APP_UPLOADS_PER_USER_DAILY_BYTES: "${APP_UPLOADS_PER_USER_DAILY_BYTES:-524288000}"
      # Point at the self-hosted LibreTranslate service below (no API key, no rate limit).
      # Override with TRANSLATION_BASE_URL if you swap in a paid endpoint later.
      TRANSLATION_BASE_URL: "${TRANSLATION_BASE_URL:-http://libretranslate:5000}"
      TRANSLATION_API_KEY: "${TRANSLATION_API_KEY:-}"
    volumes:
      # Uploaded documents and temporary extraction artifacts (database data is in PostgreSQL).
      - dems-data:/app/data
    extra_hosts:
      # Makes host.docker.internal work on Linux as well as Docker Desktop.
      - "host.docker.internal:host-gateway"
    expose:
      - "8080"
    ports:
      - "8083:8080"
    depends_on:
      # LibreTranslate is optional at runtime (fail-open), but declaring the dep means compose
      # starts it in parallel so the first requests aren't racing the model download.
      - libretranslate
    restart: unless-stopped
    labels:
      # Neurix reverse proxy → auto-SSL. Domain gets an https cert; port is the host port above.
      - "neurix.proxy.domain=dataentry-api.neurix.uk"
      - "neurix.proxy.port=8083"

  frontend:
    build:
      context: ./frontend
    container_name: dems-frontend
    depends_on:
      - backend
    ports:
      - "8082:80"
    restart: unless-stopped
    labels:
      # Public UI — this is what end-users open in their browser.
      - "neurix.proxy.domain=dataentry.neurix.uk"
      - "neurix.proxy.port=8082"

  libretranslate:
    # Self-hosted translation — no API key, no rate limits.  Only loads the two language
    # packs we actually use (en, ar) so the image stays small and boot is fast.  Downloaded
    # models are cached in the named volume so subsequent restarts don't re-download.
    image: libretranslate/libretranslate:latest
    container_name: dems-libretranslate
    environment:
      LT_LOAD_ONLY: "en,ar"
      LT_DISABLE_WEB_UI: "true"
      LT_UPDATE_MODELS: "false"
    volumes:
      - libretranslate-models:/home/libretranslate/.local
    expose:
      - "5000"
    # Not published to the host — only the backend needs to reach it.
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/languages', timeout=5).read()"]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 120s

volumes:
  dems-data:
    driver: local
  libretranslate-models:
    driver: local
