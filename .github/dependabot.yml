# Dependabot: weekly PRs for security + minor updates on the two dependency graphs the
# repo actually has. Set to `weekly` so PRs stack up predictably instead of arriving
# whenever a random CVE lands. Grouping keeps the PR count sane — one PR per ecosystem
# per week, with each patch bundled inside.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      spring:
        # Spring Boot forces a lock-step upgrade of many artifacts — bundle them.
        patterns: ["org.springframework*", "io.micrometer*"]
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    labels: ["deps", "backend"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    labels: ["deps", "frontend"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["deps", "ci"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    labels: ["deps", "docker"]
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    labels: ["deps", "docker"]
