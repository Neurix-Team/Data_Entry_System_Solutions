name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — mvn verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        working-directory: backend
        run: mvn -B -ntp verify

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Backend tests
          path: backend/target/surefire-reports/*.xml
          reporter: java-junit

  frontend:
    name: Frontend — npm build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Report known vulnerabilities without failing the build — Dependabot opens PRs
      # to actually fix them, this step just surfaces the state in the check log so a
      # reviewer sees the drift without hunting the security tab. `|| true` because
      # `npm audit` exits non-zero when it finds anything, and we don't want an old
      # advisory in a transitive dep to block merges.
      - name: Audit runtime deps (informational)
        run: npm audit --omit=dev || true

      - name: Build production bundle
        run: npm run build
