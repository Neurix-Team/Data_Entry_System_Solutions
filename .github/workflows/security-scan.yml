name: Security scan

# Weekly OWASP Dependency-Check + npm audit summary. Runs on schedule so it doesn't
# gate merges; failures open GitHub Issues via the summary you'll see in the Actions tab.
# Also manually triggerable — bump the schedule if a critical CVE lands.
on:
  schedule:
    # Every Monday 06:00 UTC — right after Dependabot's PRs land so the scan tells you
    # what those PRs would fix.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  owasp:
    name: OWASP Dependency-Check (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Uses the plugin without pinning it into pom.xml, so a bad plugin release can be
      # rolled back here without a code commit. `-Dformats=HTML,JSON` gives both a human
      # report and one grep-able output; NVD API key optional but recommended for rate
      # limits — set NVD_API_KEY as a repo secret.
      - name: Run dependency-check
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn -B -ntp \
            org.owasp:dependency-check-maven:9.2.0:check \
            -Dformats=HTML,JSON \
            -DfailBuildOnCVSS=11 \
            ${NVD_API_KEY:+-DnvdApiKey=$NVD_API_KEY}

      # Publish the reports so a reviewer can drill into individual findings without
      # cloning the repo.
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.*
          retention-days: 30

  npm-audit:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Audit runtime deps
        # Fails only on high/critical — noisy moderate warnings would spam without action.
        run: npm audit --omit=dev --audit-level=high
