server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads (PDF / Word / Excel / images) can be large; OCR can take a while. The 60m
    # limit matches TicketDocumentService.MAX_FILE_BYTES + form overhead so legitimate
    # uploads reach the backend and get a clean 413 if they exceed the per-file cap.
    client_max_body_size 60m;
    client_body_timeout 300s;

    # Static assets — long cache
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Public brand images keep stable names (they are copied from /public by Vite), so use
    # a shorter cache than hashed /assets files while still avoiding repeat downloads on
    # every visit. This includes the browser-tab icon and the logos used by the app shell.
    location ~* \.(?:png|ico|webp|jpg|jpeg)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Always revalidate the tiny entry document so it never points at chunks from an older
    # deployment. The referenced hashed assets remain aggressively cached above.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Proxy API calls to the backend container
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 10s;
    }

    # SPA fallback — any non-file route goes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
