server {
    listen 80;
    server_name _;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 520m;
    client_body_timeout 600s;

    location /assets/ {
        expires 30d;

        try_files $uri =404;
    }

    # Static image files only (the SPA's own icons). Regex locations are checked before a
    # plain-prefix location, so without a length check this would swallow every dynamic
    # image the API serves under /api/ too (extracted document images, avatars) — those
    # requests have to reach the backend, not be looked up on disk and 404. `^~` on
    # location /api/ below is what actually protects it; this guard is a second line of
    # defense in case a future edit drops that modifier.
    location ~* \.(?:png|ico|webp|jpg|jpeg)$ {
        if ($request_uri ~ ^/api/) {
            break;
        }
        expires 7d;

        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    # ^~ stops nginx from then testing the regex locations above (e.g. the image-extension
    # one) against paths under /api/ — without it, a dynamic image URL such as
    # /api/user/extractions/{id}/images/page.png never reaches the backend and 404s.
    location ^~ /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 10s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
