global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: dems

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["dems-alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: dems-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["dems-backend:9090"]
        labels:
          component: backend

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
