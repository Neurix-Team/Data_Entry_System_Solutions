server:
  port: 8080
  tomcat:
    # 60 MB gives a small margin over the 50 MB per-file cap in TicketDocumentService so
    # a legitimate at-the-limit upload isn't rejected by the container before the service
    # can return a clean 413.
    max-http-form-post-size: 60MB
    max-swallow-size: 60MB

spring:
  config:
    # Lets local Maven/JAR runs consume the git-ignored root .env file. Containers receive
    # the same values as environment variables from docker-compose.yml.
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dataentry}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:daleel}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
      validation-timeout: 5000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 60MB
      max-request-size: 60MB
      file-size-threshold: 2MB

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-a-very-long-random-secret-key-min-32-chars}
    expiration-ms: 86400000  # 24 hours
  cors:
    # Comma-separated allowlist of origins that can call this API with credentials.
    # Set explicitly via APP_CORS_ALLOWED_ORIGINS.  Default is a safe local-dev origin —
    # DO NOT ship "*" in production; combined with allowCredentials(true) that lets any
    # site with a logged-in user's browser cookie call the API.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:8082}
  auth:
    # Set to false ONLY when running the API over plain HTTP in local dev — browsers refuse to
    # send Secure cookies over HTTP, so login would silently break.  Docker/prod: leave true.
    cookie-secure: ${APP_AUTH_COOKIE_SECURE:true}
  uploads:
    # Per-user rolling 24h upload byte cap. Prevents any one agent from filling the OCR queue.
    per-user-daily-bytes: ${APP_UPLOADS_PER_USER_DAILY_BYTES:524288000}
  security:
    login-rate:
      # Persist counters in PostgreSQL so restart/scale-out cannot reset brute-force protection.
      storage: ${APP_LOGIN_RATE_STORAGE:database}
      max-attempts: 10
      window-seconds: 300
  seed:
    enabled: true
    admin-username: ${APP_SEED_ADMIN_USERNAME:admin}
    admin-password: ${APP_SEED_ADMIN_PASSWORD:admin123}
    # SUPER_ADMIN is the cross-team operator — sees and manages every team, can "enter" any
    # team as an impersonated admin. Only one is auto-seeded; extras are created from the
    # super-admin UI. Rotate these before first prod boot; the seeder logs a loud warning if
    # they're still the built-in defaults.
    superadmin-username: ${APP_SEED_SUPERADMIN_USERNAME:superadmin}
    superadmin-password: ${APP_SEED_SUPERADMIN_PASSWORD:superadmin123}
  impersonation:
    # Lifetime of the JWT issued when a super admin "enters" a team. Kept short so an
    # accidentally leaked cookie doesn't grant long-lived team access.
    ttl-ms: ${APP_IMPERSONATION_TTL_MS:1800000}  # 30 minutes
  pdf:
    # Bumped from 200k to 2M so a full-length article (e.g. long reports, book chapters,
    # merged research files) fits without truncation.
    max-chars: 2000000
    output-dir: ${java.io.tmpdir}/dataentry-pdf
    # Where extracted PDF images sit between /pdf/extract and ticket submit.
    # Anything older than extractions-ttl-hours is swept lazily on the next extraction.
    extractions-dir: ./data/extractions
    extractions-ttl-hours: 24
    images:
      # Skip tiny icons/decorations so the user isn't flooded with noise.
      min-side-px: 64
      # Hard cap per document to keep a pathological PDF from filling disk.
      max-per-doc: 40
  ocr:
    tessdata-path: /usr/share/tesseract-ocr/4.00/tessdata/
    languages: ara+eng
  translation:
    # LibreTranslate endpoint. Docker-compose wires this to a self-hosted `libretranslate`
    # service (no key, no rate limit). Leave blank to disable translation entirely — the
    # bilingual columns will just mirror the original text and no external calls are made.
    # The public https://libretranslate.com now requires a paid API key, so it's NOT the default.
    base-url: ${TRANSLATION_BASE_URL:}
    api-key: ${TRANSLATION_API_KEY:}
    timeout-ms: 8000
    # If translation call fails (network / timeout / 5xx), keep the original text in both
    # columns instead of erroring the save.
    fail-open: true

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    com.dataentry.service.PdfExtractionService: DEBUG
    com.dataentry.service.DocumentExtractionService: DEBUG
