server:
  port: 8080
  forward-headers-strategy: none
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_MAX_THREADS:400}
    max-http-form-post-size: 60MB
    max-swallow-size: 60MB
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript
    min-response-size: 1KB

spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dataentry}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:daleel}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:40}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      connection-timeout: 30000
      validation-timeout: 5000
      max-lifetime: 1800000
      keepalive-time: 60000
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "Baseline captured from the 2026-09-02 pg_dump plus post-dump entities."
    locations: classpath:db/migration
    placeholder-replacement: false
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_batch_fetch_size: 50
        jdbc:
          fetch_size: 100
    show-sql: false
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 520MB
      file-size-threshold: 2MB
      location: ${app.uploads.incoming-dir}

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-a-very-long-random-secret-key-min-32-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    # Lifetime of the half-authenticated ticket issued between the password and TOTP steps.
    mfa-pending-expiration-ms: ${JWT_MFA_PENDING_EXPIRATION_MS:300000}
  mfa:
    issuer: ${APP_MFA_ISSUER:DataEntry}
    digits: ${APP_MFA_DIGITS:6}
    period-seconds: ${APP_MFA_PERIOD_SECONDS:30}
    window-steps: ${APP_MFA_WINDOW_STEPS:1}
    # ADMIN/SUPER_ADMIN accounts must enroll a device before a session token is issued.
    required-for-privileged: ${APP_MFA_REQUIRED_FOR_PRIVILEGED:true}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:8082}
  auth:
    cookie-secure: ${APP_AUTH_COOKIE_SECURE:true}
  uploads:
    per-user-daily-bytes: ${APP_UPLOADS_PER_USER_DAILY_BYTES:1099511627776}
    max-open-sessions-per-user: ${APP_UPLOADS_MAX_OPEN_SESSIONS_PER_USER:500}
    incoming-dir: ${APP_UPLOADS_INCOMING_DIR:${app.attachments.dir}/.incoming}
    chunk-bytes: ${APP_UPLOADS_CHUNK_BYTES:8388608}
    session-ttl-hours: ${APP_UPLOADS_SESSION_TTL_HOURS:24}
  attachments:
    dir: ${APP_ATTACHMENTS_DIR:${user.dir}/data/attachments}
    max-file-bytes: ${APP_ATTACHMENTS_MAX_FILE_BYTES:524288000}
  chat:
    max-file-bytes: ${APP_CHAT_MAX_FILE_BYTES:26214400}
  security:
    trusted-proxies: ${APP_TRUSTED_PROXIES:}
    # Requests per minute per client address. Everyone behind the reverse proxy shares one
    # address unless APP_TRUSTED_PROXIES is set, so this has to cover the whole office.
    api-rate:
      per-minute: ${APP_API_RATE_PER_MINUTE:6000}
    login-rate:
      storage: ${APP_LOGIN_RATE_STORAGE:database}
      max-attempts: 10
      window-seconds: 300
  seed:
    enabled: ${APP_SEED_ENABLED:false}
    admin-username: ${APP_SEED_ADMIN_USERNAME:admin}
    admin-password: ${APP_SEED_ADMIN_PASSWORD:}
    superadmin-username: ${APP_SEED_SUPERADMIN_USERNAME:superadmin}
    superadmin-password: ${APP_SEED_SUPERADMIN_PASSWORD:}
  impersonation:
    ttl-ms: ${APP_IMPERSONATION_TTL_MS:1800000}
  pdf:
    max-chars: 2000000
    output-dir: ${java.io.tmpdir}/dataentry-pdf
    extractions-dir: ./data/extractions
    extractions-ttl-hours: 24
    images:
      min-side-px: 64
      max-per-doc: 40
  ocr:
    # Blank = auto-detect (configured → $TESSDATA_PREFIX → Tesseract 5 and 4 system paths).
    tessdata-path: ${APP_OCR_TESSDATA_PATH:}
    languages: ${APP_OCR_LANGUAGES:ara+eng}
  translation:
    base-url: ${TRANSLATION_BASE_URL:}
    api-key: ${TRANSLATION_API_KEY:}
    # Aggressive per-call timeout so a slow LibreTranslate can't compound into a
    # multi-second save. `fail-open: true` below means each timeout falls back to
    # mirroring the input — same shape as a full outage — so bounded latency is
    # strictly better than best-effort quality here. Previously 8000 ms.
    timeout-ms: 2000
    fail-open: true

management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      # F-02 companion hardening: internal components (db, disk, redis...) are an
      # information leak; clients and checks only need the aggregate UP/DOWN.
      show-details: never
      show-components: never
      probes:
        enabled: true

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    com.dataentry.service.PdfExtractionService: DEBUG
    com.dataentry.service.DocumentExtractionService: DEBUG
